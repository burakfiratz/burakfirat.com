<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Academic Crawler</title>
  <desc id="desc">Kâğıt, mürekkep ve Japon mühür kırmızısından oluşan minimalist Academic Crawler proje kapağı. Kırmızı daire içindeki birbirine bağlı düğümler taranan sayfalar arasındaki bağlantı grafiğini temsil eder.</desc>

  <!-- Matches burakfirat.com design tokens and the Derin / HemenBul cover composition. -->
  <rect width="1200" height="630" fill="#F2F0EA"/>

  <!-- Vermilion hanko: crawled pages linked into a small graph. -->
  <circle cx="998" cy="165" r="220" fill="#BE3D2D"/>
  <g transform="translate(890 42)">
    <g fill="none" stroke="#F2F0EA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M57 70H110Q120 70 120 80V97Q120 108 130 108H160"/>
      <path d="M57 70V138Q57 148 67 148H110"/>
      <path d="M110 148V176Q110 186 120 186H160"/>
    </g>
    <g fill="#F2F0EA">
      <circle cx="57" cy="70" r="20"/>
      <circle cx="160" cy="108" r="20"/>
      <circle cx="110" cy="148" r="20"/>
      <circle cx="160" cy="186" r="20"/>
    </g>
  </g>

  <!-- Same editorial typography as the existing project art. -->
  <text x="77" y="511" font-family="Georgia, 'Times New Roman', serif" font-size="105" font-weight="400" letter-spacing="-2.5" fill="#1C1D21">Academic Crawler</text>
  <text x="83" y="557" font-family="'Courier New', monospace" font-size="19" letter-spacing="2.8" fill="#62636B">CRAWLER / INDEXING</text>
  <rect x="383" y="541" width="40" height="2" fill="#BE3D2D"/>
  <text x="442" y="557" font-family="'Courier New', monospace" font-size="17" letter-spacing="1.2" fill="#62636B">ACADEMIC SEARCH</text>
</svg>
