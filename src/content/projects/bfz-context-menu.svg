  <path d="M1070 275l8 7-8 7" fill="none" stroke="#1C1D21" stroke-width="2"/>

  <!-- cursor points to selected command -->
  <path d="M1040 363L1073 428L1080 401L1108 391Z" fill="#1C1D21" stroke="#F2F0EA" stroke-width="5" stroke-linejoin="round"/>

  <!-- upper-left architectural mark -->
  <path d="M79 164V267 M79 164H182" fill="none" stroke="#BE3D2D" stroke-width="3"/>
  <path d="M104 193h22v22h-22z M138 193h22v22h-22z M104 228h22v22h-22z" fill="none" stroke="#1C1D21" stroke-width="1.8"/>
  <rect x="138" y="228" width="22" height="22" fill="#BE3D2D"/>

  <!-- typography -->
  <text x="74" y="478" font-family="Georgia,'Times New Roman',serif" font-size="104" letter-spacing="-4" fill="#1C1D21">BFZ</text>
  <text x="75" y="558" font-family="Georgia,'Times New Roman',serif" font-size="52" letter-spacing="-1.5" fill="#1C1D21">Context Menu</text>
