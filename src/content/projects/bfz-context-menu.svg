<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">BFZ Context Menu — proje kapağı</title>
  <desc id="desc">Kâğıt, mürekkep ve Japon mühür kırmızısı paletinde hazırlanmış minimalist grafik: sağda satırlardan oluşan bir sağ tık menüsü ve seçili komutu işaret eden bir imleç.</desc>
  <rect width="1200" height="630" fill="#F2F0EA"/>

  <!-- editorial hairlines -->
  <line x1="79" y1="82" x2="1121" y2="82" stroke="#1C1D21" stroke-width="1" opacity=".12"/>
  <text x="81" y="65" font-family="'Courier New',monospace" font-size="16" letter-spacing="3" fill="#777674">PERSONAL TOOLS</text>
  <text x="1121" y="65" text-anchor="end" font-family="'Courier New',monospace" font-size="16" letter-spacing="2" fill="#777674">01 / 2023</text>

  <!-- paper shadow and menu geometry -->
  <rect x="770" y="146" width="335" height="361" rx="6" fill="#1C1D21" opacity=".055" transform="translate(13 13)"/>
  <rect x="770" y="146" width="335" height="361" rx="5" fill="#F2F0EA" stroke="#1C1D21" stroke-width="2.8"/>
  <rect x="770" y="146" width="335" height="60" fill="#EAE6DF"/>
  <path d="M770 206H1105" stroke="#1C1D21" stroke-width="2"/>
  <circle cx="801" cy="176" r="7" fill="#BE3D2D"/>
  <circle cx="827" cy="176" r="7" fill="#1C1D21" opacity=".18"/>
  <circle cx="853" cy="176" r="7" fill="#1C1D21" opacity=".18"/>
  <path d="M795 248H1080 M795 296H1080 M795 392H1080 M795 440H1080" stroke="#D5D1CA" stroke-width="2"/>

  <!-- menu items -->
  <rect x="795" y="225" width="15" height="15" rx="2.5" fill="#1C1D21"/>
  <path d="M825 231H949" stroke="#1C1D21" stroke-width="7" stroke-linecap="round" opacity=".55"/>
  <path d="M825 277H973" stroke="#1C1D21" stroke-width="7" stroke-linecap="round" opacity=".42"/>
  <rect x="783" y="314" width="307" height="61" rx="3" fill="#BE3D2D"/>
  <rect x="796" y="334" width="14" height="14" rx="2.5" fill="#F2F0EA"/>
  <path d="M825 342H1036" stroke="#F2F0EA" stroke-width="8" stroke-linecap="round"/>
  <path d="M825 415H963" stroke="#1C1D21" stroke-width="7" stroke-linecap="round" opacity=".5"/>
