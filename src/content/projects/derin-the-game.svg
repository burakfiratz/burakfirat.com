<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Derin — The Game</title>
  <desc id="desc">Kâğıt üzerinde mürekkep ve Japon mühür kırmızısıyla hazırlanmış minimalist Derin proje kapağı. Kırmızı daire içerisindeki dört kare modüler oyun sistemini simgeler.</desc>

  <!-- Match burakfirat.com project-cover palette. -->
  <rect width="1200" height="630" fill="#F2F0EA"/>

  <!-- A single vermilion hanko-like seal: four modules, one core. -->
  <circle cx="998" cy="165" r="220" fill="#BE3D2D"/>
  <g fill="#F2F0EA">
    <rect x="914" y="79" width="72" height="72" rx="2"/>
    <rect x="1004" y="79" width="72" height="72" rx="2"/>
    <rect x="914" y="169" width="72" height="72" rx="2"/>
    <rect x="1004" y="169" width="72" height="72" rx="2"/>
  </g>
  <circle cx="950" cy="115" r="11" fill="#BE3D2D"/>

  <text x="77" y="511" font-family="Georgia, 'Times New Roman', serif" font-size="105" font-weight="400" letter-spacing="-2.5" fill="#1C1D21">Derin</text>
  <text x="83" y="557" font-family="'Courier New', monospace" font-size="19" letter-spacing="3.1" fill="#62636B">THE GAME</text>
  <rect x="247" y="541" width="40" height="2" fill="#BE3D2D"/>
  <text x="305" y="557" font-family="'Courier New', monospace" font-size="17" letter-spacing="1.2" fill="#62636B">MODÜLER TARAYICI OYUNU</text>
</svg>
