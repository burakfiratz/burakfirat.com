<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">HemenBul</title>
  <desc id="desc">Kâğıt, mürekkep ve Japon mühür kırmızısından oluşan minimalist HemenBul proje kapağı. Kırmızı daire içindeki sade, yüzen arama penceresi masaüstü aramayı temsil eder.</desc>

  <!-- Matches burakfirat.com design tokens and the approved Derin cover composition. -->
  <rect width="1200" height="630" fill="#F2F0EA"/>

  <!-- Vermilion hanko: a small floating window and a search gesture. -->
  <circle cx="998" cy="165" r="220" fill="#BE3D2D"/>
  <g fill="none" stroke="#F2F0EA" stroke-linecap="round" stroke-linejoin="round">
    <rect x="890" y="94" width="217" height="156" rx="9" stroke-width="12"/>
    <path d="M894 133H1102" stroke-width="9"/>
    <circle cx="953" cy="182" r="25" stroke-width="11"/>
    <path d="M972 202L998 227" stroke-width="11"/>
    <path d="M1023 174H1068M1023 196H1051" stroke-width="9"/>
  </g>

  <!-- Same editorial typography as the existing project art. -->
  <text x="77" y="511" font-family="Georgia, 'Times New Roman', serif" font-size="105" font-weight="400" letter-spacing="-2.5" fill="#1C1D21">HemenBul</text>
  <text x="83" y="557" font-family="'Courier New', monospace" font-size="19" letter-spacing="2.8" fill="#62636B">MASAÜSTÜ ARAMA</text>
  <rect x="327" y="541" width="40" height="2" fill="#BE3D2D"/>
  <text x="386" y="557" font-family="'Courier New', monospace" font-size="17" letter-spacing="1.2" fill="#62636B">ELECTRON · SVELTE</text>
</svg>
