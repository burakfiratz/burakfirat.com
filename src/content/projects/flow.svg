<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Flow</title>
  <desc id="desc">Kâğıt, mürekkep ve Japon mühür kırmızısından oluşan minimalist Flow proje kapağı. Kırmızı daire içindeki ardışık dört görev; ikisi tamamlanmış, biri aktif, biri bekleyen haliyle tema geliştirme kontrol listesini temsil eder.</desc>

  <!-- Matches burakfirat.com design tokens and the existing project cover composition. -->
  <rect width="1200" height="630" fill="#F2F0EA"/>

  <!-- Vermilion hanko: four sequential tasks, the last one still pending. -->
  <circle cx="998" cy="165" r="220" fill="#BE3D2D"/>
  <g transform="translate(869 39) scale(1.2)">
    <path d="M58 62V105H157V157" fill="none" stroke="#F2F0EA" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
    <g fill="#F2F0EA">
      <rect x="39" y="43" width="38" height="38"/>
      <rect x="39" y="90" width="38" height="38"/>
      <rect x="138" y="88" width="38" height="38"/>
    </g>
    <rect x="141" y="141" width="32" height="32" fill="#BE3D2D" stroke="#F2F0EA" stroke-width="6"/>
  </g>

  <!-- Same editorial typography as the existing project art. -->
  <text x="77" y="511" font-family="Georgia, 'Times New Roman', serif" font-size="105" font-weight="400" letter-spacing="-2.5" fill="#1C1D21">Flow</text>
  <text x="83" y="557" font-family="'Courier New', monospace" font-size="19" letter-spacing="2.8" fill="#62636B">THEME DEVELOPMENT</text>
  <rect x="368" y="541" width="40" height="2" fill="#BE3D2D"/>
  <text x="427" y="557" font-family="'Courier New', monospace" font-size="17" letter-spacing="1.2" fill="#62636B">CHECKLIST</text>
</svg>
