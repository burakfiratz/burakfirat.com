<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">logtool</title>
  <desc id="desc">Kâğıt, mürekkep ve Japon mühür kırmızısından oluşan minimalist logtool proje kapağı. Kırmızı daire içindeki log satırları ve özet çubukları access log analizini temsil eder.</desc>

  <!-- Matches burakfirat.com design tokens and the existing project cover composition. -->
  <rect width="1200" height="630" fill="#F2F0EA"/>

  <!-- Vermilion hanko: log lines turning into summary bars. -->
  <circle cx="998" cy="165" r="220" fill="#BE3D2D"/>
  <g transform="translate(907 74) scale(0.9)" fill="none" stroke="#F2F0EA" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M0 34V0H202V202H0V168" stroke-width="10"/>
    <path d="M30 48H168M30 82H131M30 116H159" stroke-width="10"/>
    <path d="M40 172V153M82 172V143M124 172V132M166 172V145" stroke-width="18"/>
  </g>

  <!-- Same editorial typography as the existing project art. -->
  <text x="77" y="511" font-family="Georgia, 'Times New Roman', serif" font-size="105" font-weight="400" letter-spacing="-2.5" fill="#1C1D21">logtool</text>
  <text x="83" y="557" font-family="'Courier New', monospace" font-size="19" letter-spacing="2.8" fill="#62636B">ACCESS LOG</text>
  <rect x="270" y="541" width="40" height="2" fill="#BE3D2D"/>
  <text x="329" y="557" font-family="'Courier New', monospace" font-size="17" letter-spacing="1.2" fill="#62636B">TRAFFIC ANALYTICS</text>
</svg>
